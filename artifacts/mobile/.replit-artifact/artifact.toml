kind = "mobile"
previewPath = "/"
title = "Senior Planner"
description = "A private, offline-capable planner that stores tasks, events, and due dates on this device."
version = "1.0.0"
id = "artifacts/mobile"
router = "path"

[[services]]
name = "expo"
ensurePreviewReachable = "/"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
serve = "static"
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]

[services.env]
PORT = "18115"
